<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attacca Web</title>
<meta name="description" content="Chained playlists in the browser from an Attacca Desktop library (.bpcr2)">
<style>
:root {
  --bg: #ffffff; --surface: #f4f4f4; --line: #d8d8d8; --text: #1b1b1b; --dim: #666;
  --accent: #d32f2f; --on-accent: #fff; --chip: #ffdad6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121212; --surface: #1e1e1e; --line: #333; --text: #eee; --dim: #9a9a9a;
          --accent: #ff453a; --on-accent: #fff; --chip: #4a2522; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 20px; margin: 0; flex: 1; }
header svg { width: 32px; height: 32px; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
section { background: var(--surface); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
section h2 { font-size: 16px; margin: 0 0 10px; }
.hint { color: var(--dim); font-size: 13px; margin: 6px 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 8px 0; }
.row > label { min-width: 120px; }
input[type=text], input[type=number], select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit; }
input[type=number] { width: 90px; }
input[type=text] { min-width: 0; flex: 1; }
button { font: inherit; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 7px 16px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip { border-radius: 8px; padding: 5px 10px; font-size: 13px; }
.chip.on { background: var(--chip); border-color: var(--accent); }
#drop { border: 2px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; }
#drop.over { border-color: var(--accent); }
.found { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; margin-top: 6px; }
.found div { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid var(--line); }
.found div:hover { background: var(--chip); }
.found small { display: block; color: var(--dim); }
.list { background: var(--surface); border-radius: 10px; margin-bottom: 8px; }
.list .head { display: flex; gap: 10px; align-items: center; padding: 10px 14px; cursor: pointer; }
.list .head b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list ol { margin: 0; padding: 0 14px 10px 40px; font-size: 13px; }
.list ol li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dim { color: var(--dim); font-size: 13px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="13" fill="#000"/>
    <g fill="#ff453a"><rect x="13" y="26" width="4.2" height="8" rx=".6"/><rect x="19" y="21" width="4.2" height="13" rx=".6"/><rect x="25" y="17" width="4.2" height="17" rx=".6"/></g>
    <g fill="#fff"><rect x="32.8" y="17" width="4.2" height="17" rx=".6"/><rect x="38.8" y="21" width="4.2" height="13" rx=".6"/><rect x="44.8" y="26" width="4.2" height="8" rx=".6"/></g>
    <path d="M20 14 Q31 3 42 14" stroke="#fff" stroke-width="3.6" fill="none" stroke-linecap="round"/>
    <circle cx="14.7" cy="40.7" r="1.7" fill="#ff453a"/><rect x="19.5" y="39.4" width="31.5" height="2.6" rx="1.3" fill="#ff453a"/>

  <h1>Attacca Web</h1>
  <select id="lang" aria-label="Language"></select>
</header>
<main>
<div>
  <section>
    <h2 data-t="library"></h2>
    <div id="drop"><span data-t="drop"></span><br><br><input type="file" id="file" accept=".bpcr2"></div>
    <p class="hint" id="summary"></p>
  </section>
  <div id="form" class="hidden">
    <section>
      <h2 data-t="what"></h2>
      <div class="chips" id="kinds"></div>
      <p class="hint" id="kindHint"></p>
      <div id="seedBox">
        <div class="row"><b id="seedChosen"></b><button id="seedNone" class="hidden" data-t="noSeed"></button></div>
        <div class="row"><input type="text" id="seedSearch"></div>
        <div class="found hidden" id="seedFound"></div>
        <div class="row" id="seedOptions">
          <label><input type="checkbox" id="sameMood" checked> <span data-t="sameMood"></span></label>
          <label><input type="checkbox" id="sameFamily"> <span data-t="sameFamily"></span></label>
        </div>
        <div class="row" id="fitRow"><button id="fit" disabled data-t="fit"></button><span class="dim" id="fitResult"></span></div>
      </div>
      <div id="seed2Box">
        <div class="row"><b id="seed2Chosen"></b> <button id="swapEnds" data-t="swap"></button></div>
        <div class="row"><input type="text" id="seed2Search"></div>
        <div class="found hidden" id="seed2Found"></div>
      </div>
      <div id="timeBox" class="row"><label data-t="listMinutes"></label><input type="number" id="listMinutes" min="1" max="6000" value="60"></div>
      <div id="reorderBox" class="row"><input type="file" id="playlist" accept=".m3u,.m3u8,.pls,.txt"><span class="dim" id="playlistInfo"></span></div>
      <div class="row"><label data-t="count" id="countLabel"></label><input type="number" id="count" min="2" max="5000" value="150">
        <label data-t="spacing"></label><input type="number" id="spacing" min="0" max="50"></div>
    </section>
    <section id="filters">
      <h2 data-t="filters"></h2>
      <div class="chips" id="moods"></div>
      <div class="chips" id="families"></div>
      <div class="row"><input type="text" id="artist" list="artists"><datalist id="artists"></datalist>
        <input type="text" id="genre" list="genres"><datalist id="genres"></datalist></div>
      <div class="row"><label data-t="years"></label><input type="number" id="yearFrom"> – <input type="number" id="yearTo"></div>
      <div class="row"><label>BPM</label><input type="number" id="bpmMin"> – <input type="number" id="bpmMax"></div>
      <div class="row"><label data-t="minutes"></label><input type="number" id="minMinutes" min="0" value="1"> – <input type="number" id="maxMinutes" min="0" value="20"></div>
      <div class="row"><label data-t="energy"></label><input type="number" id="eMin" min="0" max="100" step="5" value="0"> – <input type="number" id="eMax" min="0" max="100" step="5" value="100"> %</div>
      <div class="row"><label data-t="positivity"></label><input type="number" id="pMin" min="0" max="100" step="5" value="0"> – <input type="number" id="pMax" min="0" max="100" step="5" value="100"> %</div>
      <div class="row"><label data-t="voice"></label><select id="voice"><option value="0" data-t="any"></option><option value="1" data-t="withVoice"></option><option value="2" data-t="instrumental"></option></select>
        <label><input type="checkbox" id="onlyIncluded"> <span data-t="onlyIncluded"></span></label>
        <button id="clear" data-t="clear"></button></div>
      <p class="hint" data-t="filtersHint"></p>
    </section>
    <section>
      <h2 data-t="saving"></h2>
      <div class="row"><label data-t="base"></label><input type="text" id="base"></div>
      <p class="hint" data-t="baseHint"></p>
      <div class="row"><button class="primary" id="make" data-t="make"></button><span class="dim" id="status"></span></div>
    </section>
  </div>
</div>
<div id="results"></div>
</main>

function sampler(pass, count, spacing) {

function contrast(seed, pass, count, spacing) {

  for (const r of L.recs) { const f = folderOf(r.path); if (f !== folder && pass(r)) { if (!groups.has(f)) groups.set(f, []); groups.get(f).push(r); } }

    const fresh = of => of.filter(r => r.artist === NONE16 || !recent.has(r.artist));

    // among the next 12) before giving way.

const SEED_KINDS = { seed: 1, contrast: 1, forTime: 1, albums: 1, bridge: 1 }, CURVES = { riseFall: "rise_and_fall", warmUp: "warm_up", windDown: "wind_down" };

function make() {
  const spacing = $("spacing").value === "" ? L.h.spacing : num("spacing");
  const count = Math.max(2, num("count") || 150), lim = limitsOfForm();
  const lists = []; let note = "";
  // The filters as the other kinds use them ("same mood / family" belongs to "From a song" only).
  const pass = r => matchesBase(r, null) && within(r, lim);
  const seed = state.seed;
  if (SEED_KINDS[state.kind] && !seed) return status(t("chooseSeed"));
  if (state.kind === "seed") {
    const songs = fromSeed(seed, r => matchesBase(r, seed) && within(r, lim), count, spacing);
    lists.push({ name: "seed_" + seed.title, songs, links: meanLink(songs) });
  } else if (CURVES[state.kind]) {
    const songs = energyCurve(state.kind, seed, pass, count, spacing);
    if (songs.length) lists.push({ name: CURVES[state.kind], songs, links: meanLink(songs) });
  } else if (state.kind === "sampler") {
    const songs = sampler(pass, count, spacing);
    if (songs.length) lists.push({ name: "sampler", songs, links: meanLink(songs) });
  } else if (state.kind === "contrast") {
    const songs = contrast(seed, pass, count, spacing);
    if (songs.length) lists.push({ name: "opposite_" + seed.title, songs, links: meanLink(songs) });
  } else if (state.kind === "forTime") {
    const minutes = Math.max(1, num("listMinutes") || 60), songs = forTime(seed, pass, minutes, spacing);
    lists.push({ name: minutes + "_minutes_" + seed.title, songs, links: meanLink(songs) });
  } else if (state.kind === "albums") {
    const { songs, albums } = albumsLike(seed, pass, count, spacing);
    if (songs.length) { lists.push({ name: "albums_like_" + (seed.album || folderOf(seed.path).split("/").pop()), songs, links: meanLink(songs) }); note = t("albumsNote")(albums); }
  } else if (state.kind === "bridge") {
    if (!state.seed2 || state.seed2 === seed) return status(t("chooseTwo"));
    const songs = bridge(seed, state.seed2, pass, count, spacing);
    lists.push({ name: "bridge_" + seed.title + "_" + state.seed2.title, songs, links: meanLink(songs) });
  } else if (state.kind === "random") {
    // As Attacca's random list: a song at random of the moods chosen (its second mood counts),
    // and the closest songs to it, as "From a song".
    const pool = L.recs.filter(r => (!state.moods.size || state.moods.has(r.mood) || state.moods.has(r.mood2)) && pass(r));
    if (pool.length) {
      const start = pool[Math.floor(Math.random() * pool.length)];
      const songs = fromSeed(start, r => matchesBase(r, start) && within(r, lim), count, spacing);
      lists.push({ name: "random_" + start.title, songs, links: meanLink(songs) });
    }
  } else if (state.kind === "filters") {
    const pool = L.recs.filter(r => matchesBase(r, null) && within(r, lim));
    if (pool.length) {
      const [songs, links] = chain(pool, -1, count, spacing);
      const parts = [...state.moods].map(m => L.dicts[2][m]).concat([...state.families].map(f => L.dicts[3][f]), $("genre").value.trim(), $("artist").value.trim()).filter(Boolean);
      lists.push({ name: parts.join("_") || "playlist", songs, links });
    }

    const groups = new Map();
    for (const r of L.recs) if (matchesBase(r, null) && within(r, lim)) { const k = r.mood * 256 + r.family; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
    for (const k of [...groups.keys()].sort((a, b) => a - b)) {
      const members = groups.get(k); if (members.length < 8) continue;

      let first = 0, best = Infinity;
      members.forEach((r, i) => { let s = 0; for (let d = 0; d < VEC; d++) s += (r.vec[d] - centre[d]) ** 2; if (s < best) { best = s; first = i; } });

function tail(p) { const parts = p.toLowerCase().split("/"); return parts.slice(-2).join("/"); }
function status(text) { $("status").textContent = text; }

function m3u8(list) {
  const base = $("base").value.trim().replace(/[\\/]+$/, ""), win = base.includes("\\");
  const lines = ["#EXTM3U"];
  for (const r of list.songs) {
    lines.push(`#EXTINF:${r.duration},${r.artistName} - ${r.title}`);
    lines.push(win ? base + "\\" + r.path.replace(/\//g, "\\") : base + "/" + r.path);

}
function fileName(name) { return (name.replace(/[^A-Za-z0-9_.-]/g, "_") || "playlist") + ".m3u8"; }
function download(list) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([m3u8(list)], { type: "audio/x-mpegurl" }));
  a.download = fileName(list.name); a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function show(lists, note) {

  const head = document.createElement("div"); head.className = "row";
  head.innerHTML = `<b style="flex:1">${lists.length ? t("lists")(lists.length) : t("noSongs")}</b>`;
  if (lists.length > 1) { const all = document.createElement("button"); all.textContent = t("downloadAll"); all.onclick = () => lists.forEach((l, i) => setTimeout(() => download(l), i * 300)); head.appendChild(all); }
  box.appendChild(head);
  if (note) { const p = document.createElement("p"); p.className = "hint"; p.textContent = note; box.appendChild(p); }
  lists.forEach((list, idx) => {
    const d = document.createElement("div"); d.className = "list";
    const secs = list.songs.reduce((s, r) => s + r.duration, 0);
    const time = `${Math.floor(secs / 3600)}:${String(Math.floor(secs / 60) % 60).padStart(2, "0")}:${String(secs % 60).padStart(2, "0")}`;
    d.innerHTML = `<div class="head"><b></b><span class="dim">${t("songs")(list.songs.length)} · ${time} · ${t("links")} ${list.links.toFixed(2)}</span></div><ol class="${lists.length > 1 || idx ? "hidden" : ""}"></ol>`;
    d.querySelector("b").textContent = list.name;
    const btn = document.createElement("button"); btn.textContent = t("download"); btn.onclick = e => { e.stopPropagation(); download(list); };
    d.querySelector(".head").appendChild(btn);
    const ol = d.querySelector("ol");
    for (const r of list.songs) { const li = document.createElement("li"); li.textContent = `${r.artistName} — ${r.title}`; ol.appendChild(li); }
    d.querySelector(".head").onclick = () => ol.classList.toggle("hidden");

// ---------- Page ----------
const KINDS = [["seed", "fromTrack", "hintSeed"], ["filters", "byFilters", "hintFilters"], ["auto", "automatic", "hintAuto"], ["reorder", "reorder", "hintReorder"],
  ["riseFall", "kRiseFall", "hintRiseFall"], ["warmUp", "kWarmUp", "hintWarmUp"], ["windDown", "kWindDown", "hintWindDown"], ["sampler", "kSampler", "hintSampler"],
  ["contrast", "kContrast", "hintContrast"], ["forTime", "kForTime", "hintForTime"], ["albums", "kAlbums", "hintAlbums"], ["bridge", "kBridge", "hintBridge"], ["random", "kRandom", "hintRandom"]];
function chip(label, on, click) { const b = document.createElement("button"); b.className = "chip" + (on ? " on" : ""); b.textContent = label; b.onclick = click; return b; }
function render() {
  document.documentElement.lang = lang; $("lang").value = lang;
  document.querySelectorAll("[data-t]").forEach(e => { const v = t(e.dataset.t); if (typeof v === "string") e.textContent = v; });
  $("seedSearch").placeholder = t("search"); $("artist").placeholder = t("artist"); $("genre").placeholder = t("genre");
  const kinds = $("kinds"); kinds.innerHTML = "";
  for (const [k, label] of KINDS)
    kinds.appendChild(chip(t(label), state.kind === k, () => { state.kind = k; render(); }));
  $("kindHint").textContent = t(KINDS.find(k => k[0] === state.kind)[2]);
  const k = state.kind, optional = !!CURVES[k];
  $("seedBox").classList.toggle("hidden", !SEED_KINDS[k] && !optional);
  $("seedOptions").classList.toggle("hidden", k !== "seed"); $("fitRow").classList.toggle("hidden", k !== "seed");
  $("seedNone").classList.toggle("hidden", !optional || !state.seed);
  $("seed2Box").classList.toggle("hidden", k !== "bridge");
  $("timeBox").classList.toggle("hidden", k !== "forTime");
  $("countLabel").classList.toggle("hidden", k === "forTime"); $("count").classList.toggle("hidden", k === "forTime");
  $("seed2Search").placeholder = t("search2");
  $("reorderBox").classList.toggle("hidden", state.kind !== "reorder");
  $("filters").classList.toggle("hidden", state.kind === "reorder");
  if (!L) return;
  $("summary").textContent = t("summary")(L.recs.length, L.created, L.base);
  const moods = $("moods"); moods.innerHTML = "";
  t("moods").forEach((m, i) => moods.appendChild(chip(m, state.moods.has(i), () => { state.moods.has(i) ? state.moods.delete(i) : state.moods.add(i); render(); })));

}
function load(file) {

    try { L = readLibrary(buf); } catch (e) { $("summary").textContent = t("bad"); return; }
    $("form").classList.remove("hidden");
    $("base").value = L.base; $("spacing").value = L.h.spacing;
    $("artists").innerHTML = L.dicts[0].slice(0, 5000).map(a => `<option value="${a.replace(/"/g, "&quot;")}">`).join("");
    $("genres").innerHTML = L.dicts[1].map(g => `<option value="${g.replace(/"/g, "&quot;")}">`).join("");
    state.seed = null; state.seed2 = null; render();

$("file").onchange = e => e.target.files[0] && load(e.target.files[0]);
const drop = $("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); e.dataTransfer.files[0] && load(e.dataTransfer.files[0]); };
for (const [code, name] of Object.entries(LANGS)) {
  if (code !== "en" && code !== "es" && !MORE_TEXTS[code]) continue;
  const o = document.createElement("option"); o.value = code; o.textContent = name; $("lang").appendChild(o);
}
$("lang").onchange = e => { lang = e.target.value; try { localStorage.setItem("lang", lang); } catch (x) {} render(); };
function searchSongs(input, found, choose) { $(input).oninput = e => {
  const words = e.target.value.toLowerCase().split(/\s+/).filter(Boolean), box = $(found);
  box.innerHTML = ""; box.classList.toggle("hidden", words.length === 0 || !L);
  if (!words.length || !L) return;
  let n = 0;
  for (const r of L.recs) {
    const hay = (r.artistName + " " + r.title + " " + r.album + " " + r.path).toLowerCase();
    if (!words.every(w => hay.includes(w))) continue;
    const d = document.createElement("div"); d.innerHTML = "<span></span><small></small>";
    d.firstChild.textContent = `${r.artistName} — ${r.title}`; d.lastChild.textContent = r.path;
    d.onclick = () => { choose(r); $(input).value = ""; box.classList.add("hidden"); render(); };
    box.appendChild(d); if (++n >= 30) break;

searchSongs("seedSearch", "seedFound", r => { state.seed = r; $("fitResult").textContent = ""; });
searchSongs("seed2Search", "seed2Found", r => { state.seed2 = r; });
$("swapEnds").onclick = () => { [state.seed, state.seed2] = [state.seed2, state.seed]; render(); };
$("seedNone").onclick = () => { state.seed = null; render(); };
$("fit").onclick = fitToSeed;
$("clear").onclick = () => {
  state.moods.clear(); state.families.clear();
  for (const id of ["artist", "genre", "yearFrom", "yearTo", "bpmMin", "bpmMax"]) $(id).value = "";
  $("eMin").value = 0; $("eMax").value = 100; $("pMin").value = 0; $("pMax").value = 100; $("voice").value = 0; $("onlyIncluded").checked = false;
  $("minMinutes").value = 1; $("maxMinutes").value = 20;
  $("fitResult").textContent = ""; render();
};
$("playlist").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(text => {
    const lines = text.split(/\r?\n/).map(s => s.trim()).filter(s => s && !s.startsWith("#"));
    state.playlist = { name: f.name.replace(/\.[^.]+$/, ""), lines };
